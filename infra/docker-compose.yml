services:
  postgres:
    image: postgres:18
    container_name: b2b-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: b2b_saas
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: b2b-saas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: